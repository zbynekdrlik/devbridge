[general]
mode = "server"
log_level = "info"
data_dir = "C:\\ProgramData\\DevBridge"

[server]
ipp_port = 631
grpc_port = 50051
dashboard_port = 9120
printer_name = "DevBridge"
spool_dir = "C:\\ProgramData\\DevBridge\\spool"

[server.tls]
cert_file = "C:\\ProgramData\\DevBridge\\certs\\server.crt"
key_file = "C:\\ProgramData\\DevBridge\\certs\\server.key"
ca_file = "C:\\ProgramData\\DevBridge\\certs\\ca.crt"

[client]
server_address = "10.0.0.1:50051"
target_printer = "HP LaserJet"
dashboard_port = 9120
reconnect_interval_secs = 5
max_reconnect_interval_secs = 60
# client_id = "my-unique-id"  # Optional: explicit client ID (overrides hostname-based ID)
# print_backend = "windows_spooler"    # "direct_ipp" | "direct_raw" | "windows_spooler"
# printer_address = "10.78.5.9:9100"   # IP:port for direct backends
# ghostscript_device = "ppmraw"        # "pwgraster" for IPP, "ppmraw" for RAW
# ghostscript_resolution = 600         # DPI

[client.tls]
cert_file = "C:\\ProgramData\\DevBridge\\certs\\client.crt"
key_file = "C:\\ProgramData\\DevBridge\\certs\\client.key"
ca_file = "C:\\ProgramData\\DevBridge\\certs\\ca.crt"

[jobs]
max_retries = 3
retry_delay_secs = 30
job_expiry_hours = 24
max_payload_size_mb = 100
