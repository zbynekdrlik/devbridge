[general]
mode = "client"
log_level = "info"
data_dir = "C:\\ProgramData\\DevBridge"

[client]
server_address = "10.0.0.1:50051"
target_printer = "HP LaserJet"
dashboard_port = 9120
reconnect_interval_secs = 5
max_reconnect_interval_secs = 60

[jobs]
max_retries = 3
retry_delay_secs = 30
job_expiry_hours = 24
max_payload_size_mb = 100
# Per-job hard timeout on the client receiver. Default 1800s (30 min)
# covers slow consumer printers (Epson L3260 ~30s/page → 60 pages headroom).
print_timeout_secs = 1800
