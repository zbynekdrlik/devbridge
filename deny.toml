[advisories]
version = 2
ignore = [
    # proc-macro-error: transitive dep via ippper, no replacement yet
    "RUSTSEC-2024-0370",
    # rustls-pemfile: transitive dep via tonic/rustls stack, thin wrapper around rustls-pki-types
    "RUSTSEC-2025-0134",
    # RUSTSEC-2026-0049 removed: rustls-webpki advisory no longer matches any crate
    # RUSTSEC-2026-0098, RUSTSEC-2026-0099 removed: rustls 0.23.38 and
    # rustls-webpki 0.103.13 (both still in the dependency tree) are past the
    # affected version ranges for these name-constraint validation advisories,
    # not because the crates left the tree
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Fork of ippper that exposes IPP document-name and job-name operation
# attributes in SimpleIppJobAttributes (issue #30). Pinned to a commit
# SHA in [patch.crates-io] in the root Cargo.toml.
allow-git = ["https://github.com/zbynekdrlik/ippper.rs"]
