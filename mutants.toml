# cargo-mutants configuration
# Exclude code that cannot be tested on ubuntu-latest CI runners

# Windows-only printer code (all #[cfg(target_os = "windows")])
[[exclude]]
file = "crates/devbridge-client/src/printer.rs"

# Build orchestration — no unit-testable logic
[[exclude]]
package = "xtask"

# Service entry point — Windows service wiring, thin main()
[[exclude]]
package = "devbridge-service"
