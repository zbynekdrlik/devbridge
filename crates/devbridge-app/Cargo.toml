[package]
name = "devbridge-app"
# Must match Cargo.toml [workspace.package].version + tauri.conf.json
# version. Verified by CI's "Version Drift Check" job — if you bump one,
# bump all three. Cargo workspace inheritance does NOT work here because
# devbridge-app is in the workspace `exclude` list (Tauri toolchain).
version = "0.8.28"
edition = "2024"

[dependencies]
devbridge-core = { path = "../devbridge-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
tauri-plugin-notification = "2"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
async-trait = "0.1"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
# test-util provides tokio::time::pause / advance for deterministic
# backoff tests in detect_filter_loop.
tokio = { version = "1", features = ["full", "test-util"] }
