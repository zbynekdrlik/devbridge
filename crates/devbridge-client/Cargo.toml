[package]
name = "devbridge-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
devbridge-core = { path = "../devbridge-core" }
devbridge-server = { path = "../devbridge-server" }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.12", features = ["blocking"] }
tokio-stream = "0.1"
hostname = "0.4"
# Odoo label source (#90): PNG decode for the TSPL encoder, base64 PNG
# payloads, and the durable per-line ledger (same SQLite stack as the job DB).
png = "0.17"
base64 = "0.22"
rusqlite = { workspace = true }

[target.'cfg(windows)'.dependencies]
serialport = "4"
# winspool RAW spooling for print_backend = "windows_spooler_raw" (#88).
# OpenPrinterW is gated behind Win32_Graphics_Gdi (PRINTER_DEFAULTSW).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing"] }

[dev-dependencies]
# Fake Odoo HTTP server for the odoo_source integration tests (#90).
axum = { workspace = true }
