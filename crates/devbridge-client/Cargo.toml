[package]
name = "devbridge-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
devbridge-core = { path = "../devbridge-core" }
devbridge-server = { path = "../devbridge-server" }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
reqwest = { version = "0.12", features = ["blocking"] }
tokio-stream = "0.1"
hostname = "0.4"
# Odoo label source (#90): PNG decode for the TSPL encoder, base64 PNG
# payloads, and the durable per-line ledger (same SQLite stack as the job DB).
png = "0.17"
base64 = "0.22"
rusqlite = { workspace = true }
# Odoo device-job source (#99): the object-safe async DeviceExecutor seam.
async-trait = "0.1"
# LAN API of the tills (#101): axum router served over TLS by axum-server
# (rustls with the aws-lc-rs provider named explicitly), the store's key +
# CSR (rcgen) and the certificate's expiry / name / key (x509-parser).
axum = { workspace = true }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
x509-parser = "0.18"

[features]
# Compiles the device_jobs integration tests that register receipts on a REAL
# Portos eKasa API (InMemory + Playground only) — run by the CI `portos-live`
# job on a fresh GitHub-hosted Windows runner, never against a store (#100).
portos-live = []

[target.'cfg(windows)'.dependencies]
serialport = "4"
# winspool RAW spooling for print_backend = "windows_spooler_raw" (#88) and
# the Odoo heartbeat's native queue-state read (#97). OpenPrinterW is gated
# behind Win32_Graphics_Gdi (PRINTER_DEFAULTSW); PRINTER_INFO_2W also behind
# Win32_Security (its pSecurityDescriptor field).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security"] }

[dev-dependencies]
# LAN API tests (#101): a test CA that signs the client's CSR (x509-parser
# parses it) behind the real gRPC server.
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
tokio-stream = { version = "0.1", features = ["net"] }
# The LAN API tests' HTTPS client: rustls on every OS (Windows in portos-live).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# Durable journal / test-device files that outlive a source in the restart
# tests of the device-job source (#99).
tempfile = "3"
