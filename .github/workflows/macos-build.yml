name: macOS Build

# The macOS client (#65, one notebook) is built ONLY on demand (issue #123):
# macos-latest bills 10x, so this never runs on a push and no CI gate or
# release job depends on it. Run it from the Actions tab with an EXISTING
# release tag; it builds the DMG for that version and attaches it -- with a
# SHA256SUMS that includes it -- to that release in zbynekdrlik/devbridge-releases
# (what installer/install.sh and autoupdate.sh read) and in zbynekdrlik/devbridge,
# both through deploy/publish-release.sh.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the DMG to (vX.Y.Z or dev-latest)"
        required: true
        type: string

concurrency:
  group: macos-build-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  macos-build:
    name: macOS Build
    runs-on: macos-latest
    # builds + uploads artifacts only; its token (handed to cargo-binstall)
    # needs no write scope
    permissions:
      contents: read
    steps:
      - name: Validate the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|dev-latest)$ ]]; then
            echo "::error::tag must be vX.Y.Z or dev-latest, got '$TAG'"
            exit 1
          fi

      # dev-latest is a moving release whose tag is not moved on update:
      # build the dev branch for it, the tag itself otherwise.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag == 'dev-latest' && 'dev' || inputs.tag }}

      - name: dev-latest must carry this version's Windows installer
        if: inputs.tag == 'dev-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ver=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          assets="$(gh release view dev-latest -R zbynekdrlik/devbridge-releases --json assets -q '.assets[].name')"
          if ! grep -qx "DevBridge_${ver}_x64-setup.exe" <<<"$assets"; then
            echo "::error::dev-latest has no DevBridge_${ver}_x64-setup.exe -- the dev branch is ahead of the last dev release; wait for its CI"
            exit 1
          fi
          echo "dev-latest carries DevBridge_${ver}_x64-setup.exe"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: macos-build

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install protoc
        run: brew install protobuf

      - name: Build WASM UI
        working-directory: crates/devbridge-ui
        run: trunk build --release

      - name: Build service binary
        run: cargo build --release -p devbridge-service

      - name: Prepare sidecar with target-triple naming
        run: |
          cp target/release/devbridge-service \
             "target/release/devbridge-service-aarch64-apple-darwin"

      # tauri-cli as the PREBUILT release binary (like windows-build), never a
      # fresh `cargo install`: a source build resolves its dependencies anew,
      # and on 2026-10-13 every `zip` 8.x was yanked, so tauri-cli 2.12.3
      # (`zip = "^8"`) no longer compiled from crates.io and the release job
      # (it needed this build then) was blocked.
      - name: Install cargo-binstall
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-binstall

      - name: Install tauri-cli
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall tauri-cli --version "^2" --no-confirm --force --disable-strategies compile

      - name: Build Tauri app (DMG)
        working-directory: crates/devbridge-app
        run: cargo tauri build
        env:
          CI: true

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: devbridge-installer-macos
          path: crates/devbridge-app/target/release/bundle/dmg/*.dmg

  # Release repo first (stores read it), via the self-hosted runner of the
  # devbridge account on dev1 and its App token file (no PAT, no secret).
  # Guarded to this repo + workflow_dispatch: the repo is public until #123's
  # flip, and a job on that runner must never run for a fork or a PR.
  attach-release-repo:
    name: Attach DMG (release repo)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'zbynekdrlik/devbridge'
    needs: macos-build
    runs-on: [self-hosted, devbridge-dev1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: devbridge-installer-macos
          path: dmg/

      - name: Attach to zbynekdrlik/devbridge-releases
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          export DEVBRIDGE_GH_TOKEN_FILE="$HOME/.config/gh-app-tokens/zbynekdrlik__devbridge"
          shopt -s nullglob
          dmgs=(dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "::error::expected exactly one DMG, got ${#dmgs[@]}"; exit 1; }
          deploy/publish-release.sh attach-dmg zbynekdrlik/devbridge-releases "$TAG" "${dmgs[0]}"

  attach-code-repo:
    name: Attach DMG (this repo)
    needs: attach-release-repo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: devbridge-installer-macos
          path: dmg/

      - name: Attach to this repo
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(dmg/*.dmg)
          [[ ${#dmgs[@]} -eq 1 ]] || { echo "::error::expected exactly one DMG, got ${#dmgs[@]}"; exit 1; }
          deploy/publish-release.sh attach-dmg "$GITHUB_REPOSITORY" "$TAG" "${dmgs[0]}"
