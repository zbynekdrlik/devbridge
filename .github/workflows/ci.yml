name: CI

on:
  push:
    branches: [dev, main]

# Two-branch workflow: all dev work pushes to `dev`, then PR `dev → main`.
# Branch protection on `main` requires the `All Pass` check, which the
# push-event run reports on each commit. We deliberately omit the
# `pull_request` trigger so PRs don't re-run a full duplicate cycle —
# saves ~30-45 min on free runners per PR sync.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: read
  checks: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"
  PROTOC_VERSION: "28.3"

jobs:
  # ── Stage 1: Format ─────────────────────────────────────────────────
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  # ── Version Drift Check ─────────────────────────────────────────────
  # devbridge-app is workspace-excluded (Tauri toolchain), so cargo
  # `version.workspace = true` inheritance does NOT work here. The
  # version must be repeated in three files. This job catches drift
  # before it produces a misleading installer (e.g., 0.8.22 binaries
  # shipped under a "DevBridge_0.8.20_x64-setup.exe" filename).
  version-drift:
    name: Version Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify workspace, devbridge-app, and tauri.conf versions match
        run: |
          set -euo pipefail
          ws=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          app=$(grep -E '^version\s*=' crates/devbridge-app/Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          # Anchor on `^\s*"version"\s*:` so we only match the top-level
          # `"version"` key, not any future keys whose name happens to
          # contain "version" (e.g., `"minimumSystemVersion"`).
          tauri=$(grep -E '^\s*"version"\s*:' crates/devbridge-app/tauri.conf.json | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "workspace = $ws"
          echo "devbridge-app = $app"
          echo "tauri.conf.json = $tauri"
          if [[ "$ws" != "$app" || "$ws" != "$tauri" ]]; then
            echo "::error::Version drift detected — bump all three together (Cargo.toml workspace, crates/devbridge-app/Cargo.toml, crates/devbridge-app/tauri.conf.json)"
            exit 1
          fi
          echo "All three versions match: $ws"

  # ── Stage 2: Lint ───────────────────────────────────────────────────
  lint:
    name: Clippy
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: clippy

      - name: Install protoc
        run: |
          curl -fsSL --retry 5 -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Clippy (all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Stage 3: Test ───────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: test

      - name: Install protoc
        run: |
          curl -fsSL --retry 5 -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Run all workspace tests
        run: cargo test --workspace --all-targets

      - name: Run doc tests
        run: cargo test --workspace --doc

  # ── Stage 4: Build ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: build

      - name: Install protoc
        run: |
          curl -fsSL --retry 5 -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build WASM UI
        working-directory: crates/devbridge-ui
        run: trunk build --release

      - name: Build workspace (release)
        run: cargo build --workspace --release

      - name: Upload Linux service binary
        uses: actions/upload-artifact@v4
        with:
          name: devbridge-service-linux
          path: target/release/devbridge-service
          retention-days: 1

  # ── Stage 4b: Playwright Browser E2E ─────────────────────────────────
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: devbridge-service-linux
          path: artifacts/

      - name: Start test dashboard
        run: |
          chmod +x artifacts/devbridge-service
          mkdir -p /tmp/devbridge-test/spool
          artifacts/devbridge-service --config playwright/test-config.toml &
          echo $! > /tmp/devbridge-service.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9120/ > /dev/null 2>&1; then
              echo "Dashboard ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://127.0.0.1:9120/ || { echo "::error::Dashboard failed to start"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        working-directory: playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: playwright
        env:
          DASHBOARD_URL: http://127.0.0.1:9120
          CI: true
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 7

      - name: Stop service
        if: always()
        run: kill "$(cat /tmp/devbridge-service.pid)" 2>/dev/null || true

  # ── Stage 5: Security Audit ────────────────────────────────────────
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cargo-audit --no-confirm

      - name: Run cargo audit
        run: |
          # RUSTSEC-2024-0370: proc-macro-error is unmaintained — transitive dep via clap_derive, no replacement available
          # RUSTSEC-2025-0134: rustls ServerCertVerifier — we use plaintext gRPC over WireGuard, TLS only for printer IPPS
          # RUSTSEC-2026-0049: atty potential unaligned read — transitive dep, pending upstream fix
          cargo audit --ignore RUSTSEC-2024-0370 --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0049

  # ── Stage 6: Dependency License Check ──────────────────────────────
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --workspace

  # ── TDD Enforcement ─────────────────────────────────────────────────
  tdd-enforce:
    name: TDD Policy
    runs-on: ubuntu-latest
    needs: format
    steps:
      - uses: actions/checkout@v4

      - name: No ignored tests
        run: |
          if grep -rn '#\[ignore' crates/ tests/ 2>/dev/null; then
            echo "::error::Found #[ignore] — all tests must run"
            exit 1
          fi

      - name: No empty test bodies
        run: |
          # Check for test functions with empty bodies (opening and closing brace on same or next line with only whitespace)
          python3 -c "
          import re, sys, pathlib
          pattern = re.compile(r'#\[test\].*?\n\s*(?:async\s+)?fn\s+\w+\([^)]*\)[^{]*\{\s*\}', re.DOTALL)
          found = False
          for p in list(pathlib.Path('crates').rglob('*.rs')) + list(pathlib.Path('tests').rglob('*.rs')):
              text = p.read_text()
              for m in pattern.finditer(text):
                  print(f'::error file={p}::{m.group().strip()[:80]}')
                  found = True
          if found:
              print('::error::Found empty test body')
              sys.exit(1)
          "

      - name: No todo in production code
        run: |
          # Check for todo!() in non-test Rust code within crates/
          FOUND=$(grep -rn 'todo!()' crates/ --include='*.rs' | grep -v '#\[cfg(test)\]' | grep -v 'mod tests' | grep -v '#\[test\]' || true)
          if [ -n "$FOUND" ]; then
            # Filter out lines that are inside test modules
            REAL_FOUND=""
            while IFS= read -r line; do
              FILE=$(echo "$line" | cut -d: -f1)
              LINENUM=$(echo "$line" | cut -d: -f2)
              # Check if this line is inside a #[cfg(test)] module
              if ! head -n "$LINENUM" "$FILE" | grep -q '#\[cfg(test)\]'; then
                REAL_FOUND="$REAL_FOUND
          $line"
              fi
            done <<< "$FOUND"
            if [ -n "$REAL_FOUND" ]; then
              echo "$REAL_FOUND"
              echo "::error::Found todo!() in production code"
              exit 1
            fi
          fi

  # ── Mutation Testing ───────────��────────────────────────────────────���─
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: test

      - name: Install protoc
        run: |
          curl -fsSL --retry 5 -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install cargo-mutants
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall cargo-mutants --no-confirm

      - name: Run mutation testing
        run: |
          # Exit codes: 0=all caught, 2=some missed (FAIL), 3=some timed out (OK), 4=clean tests failed
          # Timeouts mean the mutant caused an infinite loop — effectively caught.
          cargo mutants --workspace --timeout 30 --output mutants-out --jobs 1 || EXIT=$?
          EXIT=${EXIT:-0}
          if [ "$EXIT" -eq 2 ]; then
            echo "::error::Surviving mutants detected"
            exit 1
          elif [ "$EXIT" -eq 4 ]; then
            echo "::error::Clean test suite failed"
            exit 1
          elif [ "$EXIT" -ne 0 ] && [ "$EXIT" -ne 3 ]; then
            echo "::error::cargo-mutants failed with exit code $EXIT"
            exit 1
          fi
          echo "Mutation testing passed (exit code $EXIT)"

      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-results
          path: mutants-out/
          retention-days: 5

  # ── Installer Script Tests (Pester) ─────────────────────────────────
  # Exercises the upgrade-hardening logic in installer/install.ps1 and
  # installer/post-install.ps1 that no other CI job covers: config
  # preserve-vs-rewrite branch selection, permissive force-rewrite flag
  # parse, snapshot creation, prune-to-5, the binary-swap file-unlock
  # poll, and SHA256 pre/post swap verification. windows-latest ships
  # pwsh 7 + Pester 5; tests run against throwaway temp dirs only and
  # never touch a real C:\ProgramData\DevBridge. See issue #47.
  installer-tests:
    name: Installer Tests
    runs-on: windows-latest
    needs: format
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Show Pester version
        shell: pwsh
        run: |
          $p = Get-Module -ListAvailable Pester | Sort-Object Version -Descending | Select-Object -First 1
          Write-Host "Pester $($p.Version) on PowerShell $($PSVersionTable.PSVersion)"
          if ($p.Version.Major -lt 5) {
            Write-Error "Pester 5+ required (found $($p.Version))"
            exit 1
          }

      - name: Run installer Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = 'installer/tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $cfg.Should.ErrorAction = 'Stop'
          $result = Invoke-Pester -Configuration $cfg
          # Belt-and-suspenders: fail the job on ANY failed/non-run test, and
          # also guard against a no-op (zero tests discovered) silently passing.
          if ($result.FailedCount -gt 0) {
            Write-Error "::error::$($result.FailedCount) installer Pester test(s) failed"
            exit 1
          }
          if ($result.PassedCount -lt 1) {
            Write-Error "::error::No installer Pester tests ran — empty/no-op test job is not allowed"
            exit 1
          }
          Write-Host "Installer Pester tests passed: $($result.PassedCount)/$($result.TotalCount)"

  # ── Tier 1 Gate ──────────────────────────────────────────────────────
  tier1-pass:
    name: Tier 1 Pass
    if: always()
    needs: [format, version-drift, lint, test, build, playwright-e2e, audit, deny, tdd-enforce, mutation, installer-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all Tier 1 jobs passed
        run: |
          echo "Format:      ${{ needs.format.result }}"
          echo "Version:     ${{ needs.version-drift.result }}"
          echo "Lint:        ${{ needs.lint.result }}"
          echo "Test:        ${{ needs.test.result }}"
          echo "Build:       ${{ needs.build.result }}"
          echo "Playwright:  ${{ needs.playwright-e2e.result }}"
          echo "Audit:       ${{ needs.audit.result }}"
          echo "Deny:        ${{ needs.deny.result }}"
          echo "TDD Enforce: ${{ needs.tdd-enforce.result }}"
          echo "Mutation:    ${{ needs.mutation.result }}"
          echo "Installer:   ${{ needs.installer-tests.result }}"

          if [[ "${{ needs.format.result }}" != "success" ]] || \
             [[ "${{ needs.version-drift.result }}" != "success" ]] || \
             [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.playwright-e2e.result }}" != "success" ]] || \
             [[ "${{ needs.audit.result }}" != "success" ]] || \
             [[ "${{ needs.deny.result }}" != "success" ]] || \
             [[ "${{ needs.tdd-enforce.result }}" != "success" ]] || \
             [[ "${{ needs.mutation.result }}" != "success" ]] || \
             [[ "${{ needs.installer-tests.result }}" != "success" ]]; then
            echo "::error::One or more Tier 1 jobs failed"
            exit 1
          fi

          echo "All Tier 1 checks passed"

  # ── Windows Build: NSIS Installer + E2E Binary ─────────────────────
  windows-build:
    name: Windows Build
    runs-on: windows-latest
    needs: tier1-pass
    timeout-minutes: 30
    env:
      # Static-link the MSVC CRT so the resulting .exe does not depend on
      # vc_redist.x64.exe at runtime. Without this, devbridge-service.exe
      # silently fails to load on clean Windows machines with
      # STATUS_DLL_NOT_FOUND (missing VCRUNTIME140.dll).
      RUSTFLAGS: "-D warnings -C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: windows-build

      - name: Install protoc
        shell: pwsh
        run: |
          $url = "https://github.com/protocolbuffers/protobuf/releases/download/v${env:PROTOC_VERSION}/protoc-${env:PROTOC_VERSION}-win64.zip"
          $zip = "$env:RUNNER_TEMP\protoc.zip"
          $maxAttempts = 5
          for ($i = 1; $i -le $maxAttempts; $i++) {
            try { Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing; break }
            catch { if ($i -eq $maxAttempts) { throw }; Start-Sleep -Seconds (2 * $i) }
          }
          Expand-Archive -Path $zip -DestinationPath "C:\protoc" -Force
          "C:\protoc\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & "C:\protoc\bin\protoc.exe" --version

      - name: Install trunk
        shell: pwsh
        run: |
          cargo install --locked cargo-binstall
          cargo binstall trunk --no-confirm --force

      - name: Build WASM UI
        working-directory: crates/devbridge-ui
        shell: pwsh
        run: |
          $env:PATH = "$env:CARGO_HOME\bin;$env:USERPROFILE\.cargo\bin;$env:PATH"
          trunk build --release

      - name: Build service binary
        run: cargo build --release -p devbridge-service

      - name: Prepare sidecar with target-triple naming
        shell: pwsh
        run: |
          Copy-Item "target\release\devbridge-service.exe" `
            "target\release\devbridge-service-x86_64-pc-windows-msvc.exe"

      - name: Build E2E test binary
        run: cargo build --manifest-path crates/devbridge-e2e/Cargo.toml --release

      - name: Install tauri-cli
        shell: pwsh
        run: cargo binstall tauri-cli --no-confirm --force

      - name: Download redistributables for bundling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer\redist" | Out-Null
          # VC++ Runtime (required for Rust binaries on machines without it)
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "installer\redist\vc_redist.x64.exe" -UseBasicParsing
          # SumatraPDF portable (for headless PDF printing on client)
          Invoke-WebRequest -Uri "https://www.sumatrapdfreader.org/dl/rel/3.5.2/SumatraPDF-3.5.2-64.exe" `
            -OutFile "installer\redist\SumatraPDF.exe" -UseBasicParsing
          Write-Host "VC++ Runtime: $((Get-Item installer\redist\vc_redist.x64.exe).Length) bytes"
          Write-Host "SumatraPDF: $((Get-Item installer\redist\SumatraPDF.exe).Length) bytes"

      - name: Download and extract Ghostscript portable
        shell: pwsh
        run: |
          $GsUrl = "https://github.com/ArtifexSoftware/ghostpdl-downloads/releases/download/gs10040/gs10040w64.exe"
          $GsInstaller = "$env:TEMP\gs_setup.exe"
          $GsExtractDir = "$env:TEMP\gs_nsis"
          $GsTargetDir = "installer\redist\ghostscript"

          Invoke-WebRequest -Uri $GsUrl -OutFile $GsInstaller -UseBasicParsing
          Write-Host "Downloaded: $((Get-Item $GsInstaller).Length) bytes"

          # Extract NSIS installer using 7z (available on windows-latest)
          # This extracts without running the installer — no GUI, no hanging
          7z x $GsInstaller "-o$GsExtractDir" -y | Select-String "Everything is Ok"

          # Find gswin64c.exe in extracted NSIS contents
          $GsExe = Get-ChildItem -Path $GsExtractDir -Recurse -Filter "gswin64c.exe" | Select-Object -First 1
          if (-not $GsExe) {
            # NSIS extraction puts files in `$INSTDIR` or root — list what we got
            Write-Host "Extracted contents:"
            Get-ChildItem -Path $GsExtractDir -Recurse -File | Select-Object -First 30 | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "gswin64c.exe not found after 7z extraction"
            exit 1
          }

          # Stage for NSIS bundling: bin/ + lib/ + Resource/
          New-Item -ItemType Directory -Force -Path "$GsTargetDir\bin" | Out-Null
          Copy-Item $GsExe.FullName "$GsTargetDir\bin\gswin64c.exe"
          $GsDll = Join-Path $GsExe.DirectoryName "gsdll64.dll"
          if (Test-Path $GsDll) { Copy-Item $GsDll "$GsTargetDir\bin\" }
          # Find lib and Resource relative to the exe
          $GsRoot = $GsExe.Directory.Parent.FullName
          if (Test-Path "$GsRoot\lib") { Copy-Item -Recurse "$GsRoot\lib" "$GsTargetDir\" }
          if (Test-Path "$GsRoot\Resource") { Copy-Item -Recurse "$GsRoot\Resource" "$GsTargetDir\" }
          # Also check same directory as exe
          if (Test-Path (Join-Path $GsExe.DirectoryName "lib")) { Copy-Item -Recurse (Join-Path $GsExe.DirectoryName "lib") "$GsTargetDir\" -ErrorAction SilentlyContinue }

          $totalSize = (Get-ChildItem -Path $GsTargetDir -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Ghostscript portable: $([math]::Round($totalSize, 1)) MB"
          Get-ChildItem "$GsTargetDir\bin" | ForEach-Object { Write-Host "  bin/$($_.Name) ($($_.Length) bytes)" }

      - name: Build Tauri NSIS installer
        working-directory: crates/devbridge-app
        shell: pwsh
        run: |
          $env:PATH = "$env:CARGO_HOME\bin;$env:USERPROFILE\.cargo\bin;$env:PATH"
          cargo tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: devbridge-installer
          path: crates/devbridge-app/target/release/bundle/nsis/*.exe
          retention-days: 1

      - name: Upload E2E binary
        uses: actions/upload-artifact@v4
        with:
          name: devbridge-e2e
          path: crates/devbridge-e2e/target/release/devbridge-e2e.exe
          retention-days: 1

  # ── macOS Build: DMG Installer ────────────────────────────────────────
  macos-build:
    name: macOS Build
    needs: [tier1-pass]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          key: macos-build

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install protoc
        run: brew install protobuf

      - name: Build WASM UI
        working-directory: crates/devbridge-ui
        run: trunk build --release

      - name: Build service binary
        run: cargo build --release -p devbridge-service

      - name: Prepare sidecar with target-triple naming
        run: |
          cp target/release/devbridge-service \
             "target/release/devbridge-service-aarch64-apple-darwin"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app (DMG)
        working-directory: crates/devbridge-app
        run: cargo tauri build
        env:
          CI: true

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: devbridge-installer-macos
          path: crates/devbridge-app/target/release/bundle/dmg/*.dmg

  # ── Tier 2: Deploy Client ────────────────────────────────────────────
  e2e-deploy-client:
    name: E2E Deploy Client
    if: github.event_name == 'push'
    runs-on: [self-hosted, windows, x64, pz-client]
    needs: windows-build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: devbridge-installer
          path: artifacts/

      - name: Deploy client via NSIS installer + post-install
        shell: powershell
        env:
          E2E_TARGET_PRINTER: "DevBridge-NullPrinter"
        run: |
          & { . .\deploy\e2e-setup-client-local.ps1 }

  # ── Tier 2: Deploy Server + E2E Test ─────────────────────────────────
  e2e-test:
    name: E2E Test
    if: github.event_name == 'push'
    runs-on: [self-hosted, windows, x64, pz-server]
    needs: [windows-build, e2e-deploy-client]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: devbridge-installer
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: devbridge-e2e
          path: artifacts/

      - name: Deploy and start E2E server (isolated ports)
        shell: powershell
        run: |
          & { . .\deploy\e2e-setup-server.ps1 }

      - name: Wait for services
        shell: powershell
        run: |
          & { . .\deploy\e2e-wait-ready.ps1 -DashboardPort 9220 }

      - name: Run E2E tests
        shell: powershell
        env:
          E2E_SERVER_HOST: localhost
          E2E_SERVER_DASHBOARD_PORT: "9220"
          E2E_SERVER_IPP_PORT: "1631"
          E2E_CLIENT_HOST: 10.78.2.10
          E2E_CLIENT_DASHBOARD_PORT: "9220"
          E2E_TARGET_PRINTER: "DevBridge-NullPrinter"
          E2E_SERVER_PRINTER_NAME: "DevBridge-E2E"
        run: |
          .\artifacts\devbridge-e2e.exe

      - name: Dump server logs
        if: always()
        shell: powershell
        run: |
          $logDir = "C:\ProgramData\DevBridge-E2E\logs"
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -Filter "*.log" | ForEach-Object { Write-Host "--- $($_.Name) ---"; Get-Content $_.FullName -Tail 50 }
          } else {
            Write-Host "No log directory found at $logDir"
          }

      - name: Cleanup E2E artifacts on server
        if: always()
        shell: powershell
        run: |
          & { . .\deploy\e2e-cleanup.ps1 }

  # ── Tier 2: Cleanup (runs after E2E test on client runner) ──────────
  e2e-cleanup-client:
    name: E2E Cleanup Client
    if: github.event_name == 'push' && always()
    runs-on: [self-hosted, windows, x64, pz-client]
    needs: e2e-test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Cleanup E2E artifacts on client
        shell: powershell
        run: |
          & { . .\deploy\e2e-cleanup.ps1 }

  # ── Final Gate ─────────────────────────────────────────────────────
  all-pass:
    name: All Pass
    if: always()
    needs: [tier1-pass, macos-build, e2e-test, e2e-deploy-client, e2e-cleanup-client]
    runs-on: ubuntu-latest
    steps:
      - name: Check all tiers passed
        run: |
          echo "Tier 1:          ${{ needs.tier1-pass.result }}"
          echo "macOS Build:     ${{ needs.macos-build.result }}"
          echo "E2E Test:        ${{ needs.e2e-test.result }}"
          echo "E2E Client:      ${{ needs.e2e-deploy-client.result }}"
          echo "E2E Cleanup:     ${{ needs.e2e-cleanup-client.result }}"

          # Tier 1 must always pass
          if [[ "${{ needs.tier1-pass.result }}" != "success" ]]; then
            echo "::error::Tier 1 failed"
            exit 1
          fi

          # macOS build must pass
          if [[ "${{ needs.macos-build.result }}" != "success" ]]; then
            echo "::error::macOS Build failed"
            exit 1
          fi

          # E2E only runs on push events; skipped is acceptable on PRs
          e2e_test="${{ needs.e2e-test.result }}"
          e2e_client="${{ needs.e2e-deploy-client.result }}"
          if [[ "$e2e_test" != "success" && "$e2e_test" != "skipped" ]]; then
            echo "::error::E2E Test failed"
            exit 1
          fi
          if [[ "$e2e_client" != "success" && "$e2e_client" != "skipped" ]]; then
            echo "::error::E2E Deploy Client failed"
            exit 1
          fi

          # Cleanup is best-effort — warn but don't fail the build
          cleanup_client="${{ needs.e2e-cleanup-client.result }}"
          if [[ "$cleanup_client" != "success" && "$cleanup_client" != "skipped" ]]; then
            echo "::warning::E2E Cleanup Client failed (result: $cleanup_client) — environment may be dirty"
          fi
          echo "All checks passed"

  # ── Dev Release: publish pre-release for irm|iex deploys ──────────
  dev-release:
    name: Dev Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev' && needs.all-pass.result == 'success'
    needs: [all-pass, windows-build, macos-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devbridge-installer
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: devbridge-installer-macos
          path: artifacts/

      - name: Compute checksums
        run: |
          cd artifacts
          sha256sum *.exe *.dmg > SHA256SUMS 2>/dev/null || sha256sum * > SHA256SUMS

      - name: Create or update dev pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev Build (latest)"
          body: |
            Automated dev build from commit ${{ github.sha }}.
            Updated on every successful CI run on the `dev` branch.

            Windows install: `$env:DEVBRIDGE_VERSION="dev"; irm https://raw.githubusercontent.com/zbynekdrlik/devbridge/main/installer/install.ps1 | iex`
            macOS install: `DEVBRIDGE_VERSION=dev curl -fsSL https://raw.githubusercontent.com/zbynekdrlik/devbridge/dev/installer/install.sh | bash`
          prerelease: true
          make_latest: false
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/SHA256SUMS

  # ── Stable Release: tag & publish on main merges ──────────────────
  # Promotes the just-built artifacts to a versioned stable release so
  # `irm | iex` (which fetches GitHub's "latest" stable release) works
  # without needing $env:DEVBRIDGE_VERSION="dev". Idempotent — skips
  # silently if the v$VERSION tag already exists.
  stable-release:
    name: Stable Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.all-pass.result == 'success'
    needs: [all-pass, windows-build, macos-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read workspace version
        id: ver
        run: |
          VERSION=$(grep -E '^version\s*=' Cargo.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Workspace version: $VERSION"

      - name: Skip if tag already exists
        id: tag_check
        # Pass the version through env (not GH Actions interpolation) so
        # bash never sees the value as a literal in the script body. The
        # version comes from our own Cargo.toml, not user input — the
        # safety value here is defense-in-depth and consistency.
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.tag_check.outputs.skip != 'true'
        with:
          name: devbridge-installer
          path: artifacts/

      - uses: actions/download-artifact@v4
        if: steps.tag_check.outputs.skip != 'true'
        with:
          name: devbridge-installer-macos
          path: artifacts/

      - name: Compute checksums
        if: steps.tag_check.outputs.skip != 'true'
        run: |
          cd artifacts
          sha256sum *.exe *.dmg > SHA256SUMS 2>/dev/null || sha256sum * > SHA256SUMS

      - name: Create stable release
        if: steps.tag_check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: |
            Stable release from commit ${{ github.sha }}.

            Windows install: `irm https://raw.githubusercontent.com/zbynekdrlik/devbridge/main/installer/install.ps1 | iex`
            macOS install: `curl -fsSL https://raw.githubusercontent.com/zbynekdrlik/devbridge/main/installer/install.sh | bash`
          prerelease: false
          make_latest: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/SHA256SUMS
