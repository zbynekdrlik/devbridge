name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: "28.3"

jobs:
  windows-build:
    name: Build & Release (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install trunk
        run: |
          cargo install --locked cargo-binstall
          cargo binstall trunk --no-confirm

      - name: Build WASM UI
        working-directory: crates/devbridge-ui
        run: trunk build --release

      - name: Build service binary
        run: cargo build --release -p devbridge-service

      - name: Prepare sidecar with target-triple naming
        shell: pwsh
        run: |
          Copy-Item "target\release\devbridge-service.exe" `
            "target\release\devbridge-service-x86_64-pc-windows-msvc.exe"

      - name: Install tauri-cli
        run: cargo binstall tauri-cli --no-confirm

      - name: Build Tauri NSIS installer
        working-directory: crates/devbridge-app
        run: cargo tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: devbridge-installer-windows
          path: crates/devbridge-app/target/release/bundle/nsis/*.exe
          retention-days: 1

  macos-build:
    name: Build & Release (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release

      - name: Install trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: ${{ env.PROTOC_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WASM UI
        working-directory: crates/devbridge-ui
        run: trunk build --release

      - name: Build service binary
        run: cargo build --release -p devbridge-service

      - name: Prepare sidecar with target-triple naming
        run: |
          cp target/release/devbridge-service \
             "target/release/devbridge-service-aarch64-apple-darwin"

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app (DMG)
        working-directory: crates/devbridge-app
        run: cargo tauri build
        env:
          CI: true

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: devbridge-installer-macos
          path: crates/devbridge-app/target/release/bundle/dmg/*.dmg
          retention-days: 1

  create-release:
    name: Create GitHub Release
    needs: [windows-build, macos-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: devbridge-installer-windows
          path: artifacts/

      - uses: actions/download-artifact@v4
        with:
          name: devbridge-installer-macos
          path: artifacts/

      - name: Compute checksums
        run: |
          cd artifacts
          sha256sum *.exe *.dmg > SHA256SUMS 2>/dev/null || sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.exe
            artifacts/*.dmg
            artifacts/SHA256SUMS
